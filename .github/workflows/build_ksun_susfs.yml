name: Build KSUN SUSFS Kernel
run-name: Build Kernel KSUN SUSFS (${{ inputs.phone }})
on:
  workflow_dispatch:
    inputs:
      phone:
        description: '选择手机型号：'
        required: true
        default: '小米10Pro'
        type: choice
        options:
          - 小米10
          - 小米10Pro
      version:
        description: '自定义版本名（如perf-xxx）可为空（则为n0kernel）'
        required: false
        type: string
      ksu_tag:
        description: 'KernelSU-Next tag（须用 legacy 线=手动挂钩，适配 SUSFS；默认 v3.4.0-legacy）'
        required: false
        default: 'v3.4.0-legacy'
        type: string
jobs:
  build_job:
    runs-on: ubuntu-24.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      CI: "false"
    steps:

      - name: 0.检出本仓库（SUSFS Kconfig 片段等）
        uses: actions/checkout@v4

      - name: 1.拉取编译链
        run: |
          mkdir -p $GITHUB_WORKSPACE/kernel_workspace
          cd $GITHUB_WORKSPACE/kernel_workspace
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/19.0.0git-20240125-release/Clang-19.0.0git-20240125.tar.gz
          mkdir -p clang
          tar -xzf Clang-19.0.0git-20240125.tar.gz -C clang

      - name: 2.拉取源码与补丁
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace
          git clone https://github.com/clcwpwqi/kernel_xiaomi_sm8250_n0kernel --depth=1 android_kernel
          git clone https://github.com/clcwpwqi/xiaomi10-kernelsu-susfs-kernel-build src
          git clone https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 --depth=1 susfs

      - name: 3.集成 KernelSU-Next（legacy 线）并追加 SUSFS Kconfig
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android_kernel
          curl -fLSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/dev/kernel/setup.sh" -o /tmp/ksu-setup.sh
          bash /tmp/ksu-setup.sh "${{ inputs.ksu_tag || 'v3.4.0-legacy' }}"
          echo "KSU-Next 版本: $(git -C KernelSU-Next describe --tags --always)"
          # KSU_SUSFS 系列选项的 Kconfig 声明（susfs4ksu 官方要求声明在 $KernelSU_repo/kernel/Kconfig）
          cat $GITHUB_WORKSPACE/patches/ksu-susfs-kconfig.fragment >> KernelSU-Next/kernel/Kconfig
          echo "SUSFS Kconfig 片段已追加"

      - name: 4.写入手动 hook 调用点（适配 KSU-Next v3.x legacy）
        run: |
          cd $GITHUB_WORKSPACE/kernel_workspace/android_kernel
          # v3.x Kbuild 校验 kernel/reboot.c 中的 ksu_handle_sys_reboot；本补丁按
          # KSU-Next v3.4.0-legacy 的 hook 集合生成（execveat/faccessat/stat/sys_reboot）
          patch -p1 < $GITHUB_WORKSPACE/patches/ksun-legacy-manual-hooks.patch
          cp $GITHUB_WORKSPACE/kernel_workspace/src/patches/* .
          echo "手动 hook 调用点已写入 fs/ 与 kernel/reboot.c"

      - name: 5.修补 susfs（fs 侧）
        run: |
            cd $GITHUB_WORKSPACE/kernel_workspace/android_kernel
            echo "复制susfs/kernel_patches/fs/"
            cp $GITHUB_WORKSPACE/kernel_workspace/susfs/kernel_patches/fs/* ./fs/
            echo "复制susfs/kernel_patches/include/linux/"
            cp $GITHUB_WORKSPACE/kernel_workspace/susfs/kernel_patches/include/linux/* ./include/linux/
            echo "复制susfs内核补丁"
            cp $GITHUB_WORKSPACE/kernel_workspace/susfs/kernel_patches/50_add_susfs_in_kernel-4.19.patch .
            echo "执行susfs补丁"
            patch -p1 < 50_add_susfs_in_kernel-4.19.patch || true
            echo "修复susfs补丁"
            patch -p1 < after_patch_fix.patch

      - name: 6.开始构建（含 KSU/SUSFS 配置启用与校验）
        run: |
          export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang/bin:$PATH
          echo "Updated PATH: $PATH"
          clang --version

          cd $GITHUB_WORKSPACE/kernel_workspace/android_kernel
          # 自定义版本
          if [ ! -z "${{ inputs.version }}" ]; then
            echo "自定义版本名: ${{ inputs.version }}"
            sed -i '$s|echo "\$res"|echo "-${{ inputs.version }}"|' ./scripts/setlocalversion
          else
            echo "输入为空，使用 n0kernel 默认版本名"
          fi

          if [ "${{ inputs.phone }}" = '小米10' ]; then
            echo "选择小米10配置"
            DEFCONFIG=vendor/umi_defconfig
          elif [ "${{ inputs.phone }}" = '小米10Pro' ]; then
            echo "选择小米10Pro配置"
            DEFCONFIG=vendor/cmi_defconfig
          else
            echo "输入错误"
            exit 1
          fi

          echo "当前配置为 $DEFCONFIG"

          make -j$(nproc --all) CC=clang O=out ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-buildroot-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-androideabi- $DEFCONFIG

          # defconfig 不含 KSU/SUSFS 选项，显式启用（SUS_SU 依赖 KPROBES，非 GKI 不启用）
          ./scripts/config --file out/.config \
            -e MODULES -e KSU -e KSU_MANUAL_HOOK -e KSU_SUSFS \
            -e KSU_SUSFS_HAS_MAGIC_MOUNT -e KSU_SUSFS_SUS_PATH -e KSU_SUSFS_SUS_MOUNT \
            -e KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT -e KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
            -e KSU_SUSFS_SUS_KSTAT -e KSU_SUSFS_SUS_OVERLAYFS -e KSU_SUSFS_TRY_UMOUNT \
            -e KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT -e KSU_SUSFS_SPOOF_UNAME \
            -e KSU_SUSFS_ENABLE_LOG -e KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
            -e KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG -e KSU_SUSFS_OPEN_REDIRECT
          make O=out ARCH=arm64 CC=clang LLVM=1 LLVM_IAS=1 olddefconfig

          # fail-fast：KSU/SUSFS 必须真正生效，否则产出的是无 KSU 的空壳
          for opt in CONFIG_KSU=y CONFIG_KSU_MANUAL_HOOK=y CONFIG_KSU_SUSFS=y CONFIG_KSU_SUSFS_SUS_MOUNT=y CONFIG_KSU_SUSFS_TRY_UMOUNT=y CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT=y; do
            grep -q "^$opt\$" out/.config || { echo "FATAL: $opt 未生效，请检查 Kconfig/依赖"; exit 1; }
          done
          echo "=== KSU/SUSFS 配置校验通过 ==="
          grep -E "^CONFIG_KSU|^CONFIG_KSU_SUSFS" out/.config

          make -j$(nproc --all) CC=clang O=out ARCH=arm64 CLANG_TRIPLE=aarch64-linux-gnu- LLVM=1 LLVM_IAS=1 CROSS_COMPILE=aarch64-linux-android- CROSS_COMPILE_ARM32=arm-linux-androideabi-

      - name: 7.复制boot文件
        run: |
            cd $GITHUB_WORKSPACE/kernel_workspace/android_kernel/out/arch/arm64/boot
            ls
            strings Image | grep "Linux version"
            mkdir $GITHUB_WORKSPACE/kernel_workspace/src/Anykernel/kernels/
            mkdir $GITHUB_WORKSPACE/kernel_workspace/src/Anykernel/kernels/miui/
            cp Image $GITHUB_WORKSPACE/kernel_workspace/src/Anykernel/kernels/miui/

      - name: 8.上传刷机包
        uses: actions/upload-artifact@v4
        with:
          name: SM8250-KernelSU-Next-SUSFS
          path: kernel_workspace/src/Anykernel/*
          retention-days: 7
